swagger: '2.0'
info:
  description: EbayApi
  title: EbayApi
  version: 1.0.0
consumes:
  - application/json
produces:
  - application/json
basePath: /api/ebay/v1/
paths:
  /products:
    get:
      operationId: GetAllProducts
      summary: List all products
      responses:
        200:
          description: 'OK'
          schema:
            type: array
            items:
              $ref: '#/definitions/Product'

definitions:
  Product:
    type: object
    properties:
      Id:
        type: string
        format: guid
      Name:
        type: string
      SearchQuery:
        type: string
    required:
      - Id
      - Name
      - SearchQuery