openapi: 3.1.0
info:
  title: Ebay WebApi Adapter Contract
  version: 1.0.0
servers:
  - url: /api/webapi/v1
paths:
  /lot-for-sales:
    get:
      operationId: GetLotForSales
      summary: Returns lot-for-sale aggregates
      tags:
        - WebApi
      responses:
        '200':
          description: List of lot-for-sale aggregates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotForSaleResponse'
    post:
      operationId: CreateLotForSale
      summary: Creates lot-for-sale aggregate
      tags:
        - WebApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotForSaleCreateRequest'
      responses:
        '200':
          description: Ok

  /lot-for-sales/{lotId}/description:
    get:
      operationId: GetLotForSaleDescription
      summary: Returns lot-for-sale description by lot identifier
      tags:
        - WebApi
      parameters:
        - in: path
          name: lotId
          required: true
          schema:
            type: string
            minLength: 7
            maxLength: 7
      responses:
        '200':
          description: Lot-for-sale description
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Lot for sale was not found

  /lot-for-sales/{lotId}:
    delete:
      operationId: DeleteLotForSale
      summary: Deletes lot-for-sale aggregate
      tags:
        - WebApi
      parameters:
        - in: path
          name: lotId
          required: true
          schema:
            type: string
            minLength: 7
            maxLength: 7
      responses:
        '200':
          description: Ok

  /measurements/{measurementId}/photos:
    get:
      operationId: GetMeasurementPhotos
      summary: Returns photos for measurement
      tags:
        - WebApi
      parameters:
        - in: path
          name: measurementId
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Measurement photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasurementPhotoResponse'
    post:
      operationId: UploadMeasurementPhoto
      summary: Uploads measurement photo
      tags:
        - WebApi
      parameters:
        - in: path
          name: measurementId
          required: true
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementPhotoUploadRequest'
      responses:
        '200':
          description: Ok
        '404':
          description: Measurement not found

  /measurements/{measurementId}/photos/{photoId}:
    delete:
      operationId: DeleteMeasurementPhoto
      summary: Deletes measurement photo
      tags:
        - WebApi
      parameters:
        - in: path
          name: measurementId
          required: true
          schema:
            type: string
            maxLength: 100
        - in: path
          name: photoId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ok
        '404':
          description: Photo not found

  /measurements/{measurementId}/photos/{photoId}/content:
    get:
      operationId: GetMeasurementPhotoContent
      summary: Returns measurement photo binary
      tags:
        - WebApi
      parameters:
        - in: path
          name: measurementId
          required: true
          schema:
            type: string
            maxLength: 100
        - in: path
          name: photoId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Photo binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Photo not found

  /measurements/photos/counts:
    get:
      operationId: GetMeasurementPhotoCounts
      summary: Returns photo counts for a set of measurements
      tags:
        - WebApi
      parameters:
        - in: query
          name: measurementIds
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              type: string
              maxLength: 100
      responses:
        '200':
          description: Photo counts per measurement
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasurementPhotoCountResponse'

components:
  schemas:
    LotForSaleCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - productId
        - productState
        - measurementState
      properties:
        name:
          type: string
        productId:
          type: string
          format: uuid
        productState:
          $ref: '#/components/schemas/LotForSaleProductState'
        measurementState:
          $ref: '#/components/schemas/LotForSaleMeasurementState'

    LotForSaleResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - productId
        - productState
        - measurementState
      properties:
        id:
          type: string
          minLength: 7
          maxLength: 7
        name:
          type: string
        productId:
          type: string
          format: uuid
        productState:
          $ref: '#/components/schemas/LotForSaleProductState'
        measurementState:
          $ref: '#/components/schemas/LotForSaleMeasurementState'

    LotForSaleMeasurementState:
      type: string
      enum:
        - Created
        - Selling

    LotForSaleProductState:
      type: string
      enum:
        - New
        - Used

    MeasurementPhotoResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - fileName
        - order
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        order:
          type: integer

    MeasurementPhotoCountResponse:
      type: object
      additionalProperties: false
      required:
        - measurementId
        - photoCount
      properties:
        measurementId:
          type: string
          maxLength: 100
        photoCount:
          type: integer

    MeasurementPhotoUploadRequest:
      type: object
      additionalProperties: false
      required:
        - fileName
        - contentType
        - file
      properties:
        fileName:
          type: string
        contentType:
          type: string
        order:
          type:
            - integer
            - 'null'
        file:
          type: string
          format: byte
