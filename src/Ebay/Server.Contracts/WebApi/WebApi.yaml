openapi: 3.1.0
info:
  title: Ebay WebApi Adapter Contract
  version: 1.0.0
servers:
  - url: /api/webapi/v1
paths:
  /lot-for-sales:
    get:
      operationId: GetLotForSales
      summary: Returns lot-for-sale aggregates
      tags:
        - WebApi
      responses:
        '200':
          description: List of lot-for-sale aggregates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotForSaleResponse'
    post:
      operationId: CreateLotForSale
      summary: Creates lot-for-sale aggregate
      tags:
        - WebApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotForSaleCreateRequest'
      responses:
        '200':
          description: Ok

  /lot-for-sales/{lotId}:
    delete:
      operationId: DeleteLotForSale
      summary: Deletes lot-for-sale aggregate
      tags:
        - WebApi
      parameters:
        - in: path
          name: lotId
          required: true
          schema:
            type: string
            minLength: 7
            maxLength: 7
      responses:
        '200':
          description: Ok

components:
  schemas:
    LotForSaleCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - productId
        - productState
      properties:
        name:
          type: string
        productId:
          type: string
          format: uuid
        productState:
          $ref: '#/components/schemas/LotForSaleProductState'
    LotForSaleResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - productId
        - productState
      properties:
        id:
          type: string
          minLength: 7
          maxLength: 7
        name:
          type: string
        productId:
          type: string
          format: uuid
        productState:
          $ref: '#/components/schemas/LotForSaleProductState'
    LotForSaleProductState:
      type: string
      enum:
        - New
        - Used
