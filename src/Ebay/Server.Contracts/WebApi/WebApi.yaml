openapi: 3.1.0
info:
  title: Ebay WebApi Adapter Contract
  version: 1.0.0
servers:
- url: /api
paths:
  /webapi/v1/lot-for-sales:
    get:
      operationId: GetLotForSales
      summary: Returns lot-for-sale aggregates
      tags:
      - WebApi
      responses:
        '200':
          description: List of lot-for-sale aggregates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotForSaleResponse'
    post:
      operationId: CreateLotForSale
      summary: Creates lot-for-sale aggregate
      tags:
      - WebApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotForSaleCreateRequest'
      responses:
        '200':
          description: Ok
  /webapi/v1/lot-for-sales/{lotId}/description:
    get:
      operationId: GetLotForSaleDescription
      summary: Returns lot-for-sale description by lot identifier
      tags:
      - WebApi
      parameters:
      - in: path
        name: lotId
        required: true
        schema:
          type: string
          minLength: 7
          maxLength: 7
      responses:
        '200':
          description: Lot-for-sale description
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Lot for sale was not found
  /webapi/v1/lot-for-sales/{lotId}:
    delete:
      operationId: DeleteLotForSale
      summary: Deletes lot-for-sale aggregate
      tags:
      - WebApi
      parameters:
      - in: path
        name: lotId
        required: true
        schema:
          type: string
          minLength: 7
          maxLength: 7
      responses:
        '200':
          description: Ok
  /webapi/v1/measurements/{measurementId}/photos:
    get:
      operationId: GetMeasurementPhotos
      summary: Returns photos for measurement
      tags:
      - WebApi
      parameters:
      - in: path
        name: measurementId
        required: true
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: Measurement photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasurementPhotoResponse'
    post:
      operationId: UploadMeasurementPhoto
      summary: Uploads measurement photo
      tags:
      - WebApi
      parameters:
      - in: path
        name: measurementId
        required: true
        schema:
          type: string
          maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementPhotoUploadRequest'
      responses:
        '200':
          description: Ok
        '404':
          description: Measurement not found
  /webapi/v1/measurements/{measurementId}/photos/{photoId}:
    delete:
      operationId: DeleteMeasurementPhoto
      summary: Deletes measurement photo
      tags:
      - WebApi
      parameters:
      - in: path
        name: measurementId
        required: true
        schema:
          type: string
          maxLength: 100
      - in: path
        name: photoId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
        '404':
          description: Photo not found
  /webapi/v1/measurements/{measurementId}/photos/{photoId}/content:
    get:
      operationId: GetMeasurementPhotoContent
      summary: Returns measurement photo binary
      tags:
      - WebApi
      parameters:
      - in: path
        name: measurementId
        required: true
        schema:
          type: string
          maxLength: 100
      - in: path
        name: photoId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Photo binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Photo not found
  /webapi/v1/measurements/{measurementId}/photos/{photoId}/thumbnail/content:
    get:
      operationId: GetMeasurementPhotoThumbnailContent
      summary: Returns measurement photo thumbnail binary
      tags:
      - WebApi
      parameters:
      - in: path
        name: measurementId
        required: true
        schema:
          type: string
          maxLength: 100
      - in: path
        name: photoId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Photo thumbnail binary
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Photo not found
  /webapi/v1/measurements/photos/counts:
    get:
      operationId: GetMeasurementPhotoCounts
      summary: Returns photo counts for a set of measurements
      tags:
      - WebApi
      parameters:
      - in: query
        name: measurementIds
        required: true
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Photo counts per measurement
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasurementPhotoCountResponse'
  /ebay/v1/products:
    get:
      operationId: GetAllProducts
      summary: List all products
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductWithId'
      tags:
      - Ebay
    post:
      operationId: CreateProduct
      summary: Create product
      requestBody:
        $ref: '#/components/requestBodies/ProductWithoutId'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: string
                format: guid
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetailedInfo'
      tags:
      - Ebay
  /ebay/v1/products/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: guid
    put:
      operationId: UpdateProduct
      summary: Update product
      requestBody:
        $ref: '#/components/requestBodies/ProductWithoutId'
      responses:
        '200':
          description: Updated
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetailedInfo'
      tags:
      - Ebay
    get:
      operationId: GetProduct
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductWithId'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetailedInfo'
      tags:
      - Ebay
    delete:
      operationId: DeleteProduct
      summary: Delete product
      responses:
        '200':
          description: Deleted
      tags:
      - Ebay
  /ebay/v1/products/{id}/mark_as_checked/:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: guid
    post:
      operationId: MarkProductAsChecked
      summary: MarkProductAsChecked
      responses:
        '200':
          description: Updated
        '400':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetailedInfo'
      tags:
      - Ebay
  /ebay/v1/products/{productId}/lots/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    get:
      operationId: GetLots
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotInfoShort'
        '400':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetailedInfo'
      tags:
      - Ebay
    post:
      operationId: UpsertLotInfo
      summary: Обновляет информацию о лоте
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotInfo'
        required: true
      responses:
        '200':
          description: Ok
        '400':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetailedInfo'
      tags:
      - Ebay
  /ebay/v1/products/{productId}/ignored_lots/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    get:
      operationId: GetIgnoredLots
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        '400':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetailedInfo'
      tags:
      - Ebay
    post:
      operationId: IgnoreLots
      requestBody:
        $ref: '#/components/requestBodies/IgnoreLotsIgnoredlots'
      responses:
        '200':
          description: Ok
        '400':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetailedInfo'
      tags:
      - Ebay
  /ebay/v1/products/{productId}/ignored_lots/{lotId}:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    - name: lotId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      operationId: GetIsLotIgnoredForProduct
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetailedInfo'
      tags:
      - Ebay
  /ebay/v1/products/{productId}/sale_advertisements/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    get:
      operationId: GetSaleAdvertisements
      summary: Get sale advertisements for product
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleAdvertisement'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetailedInfo'
      tags:
      - Ebay
  /ebay/v1/products/{productId}/calculate_prices/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    post:
      operationId: CalculatePricesForProduct
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
  /ebay/v1/products/{productId}/passports/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    get:
      operationId: GetProductPassports
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductPassportInfo'
      tags:
      - Ebay
    post:
      operationId: UploadProductPassport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPassportUpload'
        required: true
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
  /ebay/v1/products/{productId}/passports/{passportId}/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    - name: passportId
      in: path
      required: true
      schema:
        type: string
        format: guid
    delete:
      operationId: DeleteProductPassport
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
    put:
      operationId: UpdateProductPassport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPassportUpdate'
        required: true
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
  /ebay/v1/products/{productId}/measurements/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    get:
      operationId: GetMeasurements
      parameters:
      - name: measurementState
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MeasurementState'
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasurementData'
      tags:
      - Ebay
    post:
      operationId: UploadMeasurement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementDataToUpload'
        required: true
      responses:
        '200':
          description: Ok
        '400':
          description: InvalidMeasurement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetailedInfo'
      tags:
      - Ebay
  /ebay/v1/products/{productId}/tube_working_point/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    get:
      operationId: GetTubeWorkingPoint
      summary: Get tube working point for product
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TubeWorkingPoint'
        '400':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetailedInfo'
      tags:
      - Ebay
    post:
      operationId: UpsertTubeWorkingPoint
      summary: Upsert tube working point for product
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TubeWorkingPoint'
        required: true
      responses:
        '200':
          description: Ok
        '400':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetailedInfo'
      tags:
      - Ebay
  /ebay/v1/products/{productId}/measurements/find_matched/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    post:
      operationId: FindMatchedMeasurements
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
  /ebay/v1/products/{productId}/lotIds/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    post:
      operationId: GetLotIdsForProduct
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  nullable: true
      tags:
      - Ebay
  /ebay/v1/products/{productId}/measurements/{measurementId}/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    - name: measurementId
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    delete:
      operationId: DeleteMeasurement
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
  /ebay/v1/products/{productId}/measurements/{measurementId}/location/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    - name: measurementId
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    post:
      operationId: UpdateMeasurementLocation
      requestBody:
        $ref: '#/components/requestBodies/UpdateMeasurementLocationLocation'
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
  /ebay/v1/products/{productId}/measurements/{measurementId}/manufacture_code/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    - name: measurementId
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    post:
      operationId: UpdateMeasurementManufactureCode
      requestBody:
        $ref: '#/components/requestBodies/UpdateMeasurementLocationLocation'
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
  /ebay/v1/products/{productId}/measurements/{measurementId}/match/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    - name: measurementId
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    post:
      operationId: UpdateMeasurementMatchId
      requestBody:
        $ref: '#/components/requestBodies/UpdateMeasurementLocationLocation'
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
  /ebay/v1/products/{productId}/measurements/{measurementId}/lot/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    - name: measurementId
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    post:
      operationId: UpdateMeasurementLotId
      requestBody:
        content:
          application/json:
            schema:
              type: string
              nullable: true
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
  /ebay/v1/products/{productId}/measurements/{measurementId}/state/:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: guid
    - name: measurementId
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    post:
      operationId: UpdateMeasurementState
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementState'
        required: true
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
  /ebay/v1/lots/{lotId}/:
    parameters:
    - name: lotId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      operationId: GetLotInfo
      summary: Получить информацию о лоте
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotInfoWithProductId'
        '400':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetailedInfo'
      tags:
      - Ebay
    delete:
      operationId: DeleteLotInfo
      summary: Удалить информацию о лоте
      responses:
        '200':
          description: Ok
        '400':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetailedInfo'
      tags:
      - Ebay
  /ebay/v1/lots/:
    get:
      operationId: GetLotIds
      summary: Получить id всех лотов
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
      tags:
      - Ebay
  /ebay/v1/lot_state_requests/:
    post:
      operationId: GetLotStates
      summary: Получает информацию о учтенных лотах
      requestBody:
        $ref: '#/components/requestBodies/IgnoreLotsIgnoredlots'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotState'
      tags:
      - Ebay
  /ebay/v1/categories/:
    get:
      operationId: GetCategories
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryType'
      tags:
      - Ebay
  /ebay/v1/shipping_rates/:
    get:
      operationId: GetShippingRates
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShippingType'
                minLength: 1
      tags:
      - Ebay
  /ebay/v1/currencies/:
    get:
      operationId: GetCurrencies
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Currency'
                minLength: 1
      tags:
      - Ebay
  /ebay/v1/extract_data/:
    post:
      operationId: ExtractData
      summary: Извлекает информацию о лоте из названия и описания
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotDataToExtract'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtractedFields'
      tags:
      - Ebay
  /ebay/v1/error/:
    post:
      operationId: SaveError
      summary: Save Error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientErrorInfo'
        required: true
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
  /ebay/v1/calculate_prices_for_all/:
    post:
      operationId: CalculatePricesForAll
      responses:
        '200':
          description: Ok
      tags:
      - Ebay
components:
  schemas:
    LotForSaleCreateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - productId
      - productState
      - measurementState
      properties:
        name:
          type: string
        productId:
          type: string
          format: uuid
        productState:
          $ref: '#/components/schemas/LotForSaleProductState'
        measurementState:
          $ref: '#/components/schemas/LotForSaleMeasurementState'
    LotForSaleResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - productId
      - productState
      - measurementState
      properties:
        id:
          type: string
          minLength: 7
          maxLength: 7
        name:
          type: string
        productId:
          type: string
          format: uuid
        productState:
          $ref: '#/components/schemas/LotForSaleProductState'
        measurementState:
          $ref: '#/components/schemas/LotForSaleMeasurementState'
    LotForSaleMeasurementState:
      type: string
      enum:
      - Created
      - Selling
    LotForSaleProductState:
      type: string
      enum:
      - New
      - Used
    MeasurementPhotoResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - fileName
      - order
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        order:
          type: integer
    MeasurementPhotoCountResponse:
      type: object
      additionalProperties: false
      required:
      - measurementId
      - photoCount
      properties:
        measurementId:
          type: string
          maxLength: 100
        photoCount:
          type: integer
    MeasurementPhotoUploadRequest:
      type: object
      additionalProperties: false
      required:
      - fileName
      - contentType
      - file
      properties:
        fileName:
          type: string
        contentType:
          type: string
        order:
          type:
          - integer
          - 'null'
        file:
          type: string
          format: byte
    ProductState:
      type: string
      enum:
      - New
      - Used
    MeasurementState:
      type: string
      enum:
      - Created
      - Selling
      - Sold
    ProductWithoutId:
      type: object
      properties:
        name:
          type: string
