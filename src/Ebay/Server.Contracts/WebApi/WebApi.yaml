openapi: 3.1.0
info:
  title: Ebay WebApi Adapter Contract
  version: 1.0.0
paths:
  /api/webapi/v1/ping:
    get:
      operationId: GetPing
      summary: Ping endpoint for new WebApi adapter contract
      tags:
        - WebApi
      responses:
        '200':
          description: Pong response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /api/webapi/v1/sale-lots/{id}:
    get:
      operationId: GetSaleLotById
      summary: Get sale lot by identifier
      tags:
        - SaleLots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 7
      responses:
        '200':
          description: Sale lot response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleLotResponse'
        '404':
          description: Sale lot not found
components:
  schemas:
    PingResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
    SaleLotResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          maxLength: 7
        name:
          type: string
