<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Ebay</title>
    <base href="/"/>
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet"/>
    <link href="css/app.css" rel="stylesheet"/>
    <link href="Client.styles.css" rel="stylesheet"/>
</head>
<body>
<div id="app">Loading...</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a class="reload" href="">Reload</a>
    <a class="dismiss">🗙</a>
</div>
<script>
    // 🔐 Проверяем авторизацию перед загрузкой Blazor
    fetch('/auth/check', { credentials: 'include' })
        .then(response => {
            if (response.ok) {
                // ✅ Авторизован — грузим Blazor
                const authScript = document.createElement('script');
                authScript.src = "_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js";
                document.body.appendChild(authScript);

                const blazorScript = document.createElement('script');
                blazorScript.src = "_framework/blazor.webassembly.js";
                document.body.appendChild(blazorScript);
            } else if (response.status === 401) {
                // ❌ Не авторизован — редирект на логин
                const returnUrl = encodeURIComponent(window.location.pathname + window.location.search);
                window.location.href = `/Identity/Account/Login?returnUrl=${returnUrl}`;
            } else {
                document.getElementById('app').innerText = "Unexpected error. Try again later.";
            }
        })
        .catch(error => {
            console.error("Authorization check failed", error);
            document.getElementById('app').innerText = "Network error. Try again later.";
        });
</script>

</body>

</html>
