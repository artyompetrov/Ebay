<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ebay Extension Settings</title>
</head>
<body>
    <label>Client ID: <input id="clientId" type="text" /></label><br/>
    <label>Client Secret: <input id="clientSecret" type="text" /></label><br/>
    <label>Redirect URI Code: <input id="redirectUriCode" type="text" /></label><br/>
    <label>Mode: <select id="mode">
        <option value="Seller">Seller</option>
        <option value="Supplier">Supplier</option>
    </select></label><br/>
    <button id="save">Save</button>
    <script src="build/options.js"></script>
</body>
</html>
