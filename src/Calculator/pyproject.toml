[project]
name = "calculator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.7.1",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = ["httpx==0.27.0", "pytest==8.2.0"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
