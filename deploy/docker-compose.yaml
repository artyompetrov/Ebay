name: ebay
services:
  ebay_postgres:
    container_name: ebay_postgres
    image: postgres:16.1
    ports:
      - "15432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebay
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_INITDB_ARGS: --locale='en_US.UTF8'
      CFG_TIMEZONE: 'Europe/Moscow'
    volumes:
      - ./mount/postgres/data/:/var/lib/postgresql/data
    networks:
      - ebay_internal_network

  ebay_helper:
    container_name: ebay_helper
    image: ghcr.io/artyompetrov/ebay:latest
    depends_on:
      - ebay_postgres
    restart: unless-stopped
    volumes:
      - ${NETCORE_CERTIFICATE}:/certs/cert.pfx:ro
      - ebay_helper_keys:/app/DataProtection-Keys/
    environment:
      - DOMAIN=${DOMAIN}
      - ASPNETCORE_HTTP_PORTS="80"
      - ASPNETCORE_HTTPS_PORTS="443"
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${NETCORE_CERTIFICATE_PASSWORD}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/certs/cert.pfx
      - ASPNETCORE_IdentityServer__Key__FilePath=/certs/cert.pfx
      - ASPNETCORE_IdentityServer__Key__Password=${NETCORE_CERTIFICATE_PASSWORD}
      - ASPNETCORE_IdentityServer__Key__Type=File
      - ASPNETCORE_ConnectionStrings__DefaultConnection=User ID=ebay;Password=${PG_PASSWORD};Server=ebay_postgres;Port=5432;Database=ebay;Pooling=true;MinPoolSize=1;MaxPoolSize=30;Enlist=true;
      - DATA_PROTECTION_KEYS_DIR=/app/DataProtection-Keys/
    networks:
      - ebay_internal_network

  ebay_nginx:
    container_name: ebay_nginx
    build: ./build/nginx
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
      - "8080:8080"
    volumes:
      - ./mount/nginx/logs/:/var/log/nginx/
      - ./mount/nginx/certs/:/etc/letsencrypt/
    environment:
      - DOMAIN=${DOMAIN}
      - SELF_SIGNED_CERTIFICATE=${LOCAL_RUN}
      - EMAIL=${EMAIL}
    networks:
      - ebay_internal_network
    restart: unless-stopped

  ebay_portainer:
    container_name: ebay_portainer
    image: portainer/portainer-ce
    restart: always
    command: >
      --admin-password '${PORTAINER_HASH}'
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ebay_internal_network

  ebay_noip:
    image: ghcr.io/noipcom/noip-duc:latest
    container_name: ebay_noip
    environment:
      - NOIP_USERNAME=${NOIP_USERNAME}
      - NOIP_PASSWORD=${NOIP_PASSWORD}
      - NOIP_HOSTNAMES=all.ddnskey.com
    restart: unless-stopped

  ebay_frappe_backend:
    image: ghcr.io/artyompetrov/frappe:latest
    container_name: ebay_frappe_backend
    networks:
      - ebay_internal_network
    restart: unless-stopped
    volumes:
      - frappe_sites:/home/frappe/frappe-bench/sites
      - ./mount/frappe/logs/:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: ebay_frappe_db
      DB_PORT: "3306"
      MARIADB_ROOT_PASSWORD: $PG_PASSWORD
      REDIS_CACHE: ebay_frappe_redis_cache:6379
      REDIS_QUEUE: ebay_frappe_redis_queue:6379
      SOCKETIO_PORT: "9000"
      ADMIN_PASSWORD: $PG_PASSWORD
    entrypoint:
      - bash
      - -c
    command:
      - >
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        wait-for-it -t 120 ebay_frappe_db:3306;
        wait-for-it -t 120 ebay_frappe_redis_cache:6379;
        wait-for-it -t 120 ebay_frappe_redis_queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        bench new-site --mariadb-user-host-login-scope='%' --admin-password=$$ADMIN_PASSWORD --db-root-username=root --db-root-password=$$MARIADB_ROOT_PASSWORD --install-app ebay --set-default ebay_frappe_frontend;
        ./env/bin/gunicorn --chdir=/home/frappe/frappe-bench/sites --bind=0.0.0.0:8000 --threads=4 --workers=2 --worker-class=gthread --worker-tmp-dir=/dev/shm --timeout=120 --preload frappe.app:application;

  ebay_frappe_queue_long:
    image: ghcr.io/artyompetrov/frappe:latest
    container_name: ebay_frappe_queue_long
    networks:
      - ebay_internal_network
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - frappe_sites:/home/frappe/frappe-bench/sites
      - ./mount/frappe/logs/:/home/frappe/frappe-bench/logs

  ebay_frappe_queue_short:
    image: ghcr.io/artyompetrov/frappe:latest
    container_name: ebay_frappe_queue_short
    networks:
      - ebay_internal_network
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - frappe_sites:/home/frappe/frappe-bench/sites
      - ./mount/frappe/logs/:/home/frappe/frappe-bench/logs

  ebay_frappe_scheduler:
    image: ghcr.io/artyompetrov/frappe:latest
    container_name: ebay_frappe_scheduler
    networks:
      - ebay_internal_network
    restart: unless-stopped
    command:
      - bench
      - schedule
    volumes:
      - frappe_sites:/home/frappe/frappe-bench/sites
      - ./mount/frappe/logs/:/home/frappe/frappe-bench/logs

  ebay_frappe_websocket:
    image: ghcr.io/artyompetrov/frappe:latest
    container_name: ebay_frappe_websocket
    networks:
      - ebay_internal_network
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - frappe_sites:/home/frappe/frappe-bench/sites
      - ./mount/frappe/logs/:/home/frappe/frappe-bench/logs

  ebay_frappe_redis_queue:
    image: redis:6.2-alpine
    container_name: ebay_frappe_redis_queue
    networks:
      - ebay_internal_network
    restart: unless-stopped
    volumes:
      - redis_queue_data:/data

  ebay_frappe_redis_cache:
    image: redis:6.2-alpine
    container_name: ebay_frappe_redis_cache
    networks:
      - ebay_internal_network
    restart: unless-stopped

  ebay_frappe_db:
    image: mariadb:10.6
    container_name: ebay_frappe_db
    networks:
      - ebay_internal_network
    healthcheck:
      test: mysqladmin ping -h localhost --password=$PG_PASSWORD
      interval: 1s
      retries: 20
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MARIADB_ROOT_PASSWORD: $PG_PASSWORD
    volumes:
      - frappe_db_data:/var/lib/mysql


networks:
  ebay_internal_network:
    driver: bridge

volumes:
  frappe_sites:
  frappe_db_data:
  redis_queue_data:
  ebay_helper_keys:
  portainer_data:
