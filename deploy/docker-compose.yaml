name: ebay
services:
  ebay_postgres:
    container_name: ebay_postgres
    image: postgres:16.1
    ports:
      - "127.0.0.1:15432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebay
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_INITDB_ARGS: --locale='en_US.UTF8'
      CFG_TIMEZONE: 'Europe/Moscow'
    volumes:
      - ./mount/postgres/data/:/var/lib/postgresql/data
    networks:
      - internal_network

  ebay_helper:
    container_name: ebay_helper
    image: ghcr.io/artyompetrov/ebay:latest
    build: ../src/
    depends_on:
      ebay_postgres:
        condition: service_started
      ebay_otelcollector:
        condition: service_started
      ebay_helper_init:
        condition: service_completed_successfully
    restart: unless-stopped
    # The image is chiseled (no shell) and runs as the non-root `app` user (uid 1654).
    # Only the volumes below and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${NETCORE_CERTIFICATE}:/certs/cert.pfx:ro
      - ebay_helper_keys:/app/DataProtection-Keys/
    environment:
      - ASPNETCORE_HTTP_PORTS="80"
      - ASPNETCORE_HTTPS_PORTS="443"
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${NETCORE_CERTIFICATE_PASSWORD}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/certs/cert.pfx
      - ASPNETCORE_IdentityServer__Key__FilePath=/certs/cert.pfx
      - ASPNETCORE_IdentityServer__Key__Password=${NETCORE_CERTIFICATE_PASSWORD}
      - ASPNETCORE_IdentityServer__Key__Type=File
      - ASPNETCORE_ConnectionStrings__DefaultConnection=User ID=ebay;Password=${PG_PASSWORD};Server=ebay_postgres;Port=5432;Database=ebay;Pooling=true;MinPoolSize=1;MaxPoolSize=60;Enlist=true;
      - ASPNETCORE_AuthorizationClient__DataProtectionKeysDirectory=/app/DataProtection-Keys/
      - ASPNETCORE_AuthorizationClient__Domain=${DOMAIN}
      - ASPNETCORE_AuthorizationClient__ClientId=${CLIENT_ID}
      - ASPNETCORE_AuthorizationClient__Scope=${AUTH_SCOPE}
      - ASPNETCORE_AuthorizationClient__ClientSecret=${AUTH_CLIENT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ebay_otelcollector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=ebay_helper
      - EbayServer__IsLocalRun=${LOCAL_RUN:-true}
      - EbayServer__TargetEmail=${EMAIL}
      - Smtp__Server=${SMTP_SERVER}
      - Smtp__Port=${SMTP_PORT}
      - Smtp__Login=${SMTP_LOGIN}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__Email=${EMAIL}
    networks:
      - internal_network

  # One-shot: gives the non-root app user (uid 1654 in the chiseled image) ownership of the
  # DataProtection keys volume. Needed because volumes created by earlier root-based images are owned by root.
  ebay_helper_init:
    container_name: ebay_helper_init
    image: busybox:1.37
    volumes:
      - ebay_helper_keys:/keys/
    entrypoint: [ "chown", "-R", "1654:1654", "/keys" ]
    network_mode: none
    restart: "no"

  ebay_nginx:
    container_name: ebay_nginx
    image: ghcr.io/artyompetrov/nginx:latest
    build: ./build/nginx
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./mount/nginx/logs/:/var/log/nginx/
      - ./mount/nginx/certs/:/etc/letsencrypt/
    environment:
      - DOMAIN=${DOMAIN}
      - SELF_SIGNED_CERTIFICATE=${LOCAL_RUN}
      - EMAIL=${EMAIL}
    networks:
      - internal_network
    restart: unless-stopped

  ebay_portainer:
    container_name: ebay_portainer
    image: portainer/portainer-ce:2.26.0
    restart: unless-stopped
    command: >
      --admin-password '${PORTAINER_HASH}'
      --http-enabled
      --bind-https=127.0.0.1:9443
    # Has the Docker socket (root on the host), so it is not exposed publicly:
    # reach it through an SSH tunnel, see AGENTS.md. The SSH tunnel provides encryption, so
    # Portainer serves plain HTTP; its always-on self-signed HTTPS listener is bound to the
    # container's loopback, where nothing can reach it.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  ebay_loki:
    container_name: ebay_loki
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/loki.yaml:ro
      - ./mount/loki/:/var/lib/loki
    networks:
      - internal_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 2s
      retries: 10

  ebay_otelcollector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    container_name: ebay_otelcollector
    networks:
      - internal_network
    restart: unless-stopped
    depends_on:
      - ebay_loki
    volumes:
      - ./config/otelcollector/config.yaml:/etc/otelcol-contrib/config.yaml:ro

  ebay_grafana:
    container_name: ebay_grafana
    image: grafana/grafana:10.4.2
    depends_on:
      - ebay_loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${PG_PASSWORD}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_DOMAIN: ${DOMAIN}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/loki.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - internal_network
    restart: unless-stopped

  # One-shot: creates the read-only Grafana user used by the Grafana MCP server (see AGENTS.md)
  ebay_grafana_init:
    container_name: ebay_grafana_init
    image: curlimages/curl:8.11.1
    depends_on:
      - ebay_grafana
    environment:
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD: ${PG_PASSWORD}
      MCP_PASSWORD: ${GRAFANA_MCP_PASSWORD:-}
    volumes:
      - ./config/grafana/init-mcp-user.sh:/init-mcp-user.sh:ro
    entrypoint: [ "/bin/sh", "/init-mcp-user.sh" ]
    networks:
      - internal_network
    restart: on-failure

  ebay_webdav:
    container_name: ebay_webdav
    image: bytemark/webdav
    restart: unless-stopped
    environment:
      AUTH_TYPE: Basic
      USERNAME: ebay
      PASSWORD: ${PG_PASSWORD}
    networks:
      - internal_network
    volumes:
      - ./mount/webdav/data/:/var/lib/dav

  ebay_3xui:
    container_name: ebay_3xui
    image: ghcr.io/mhsanaei/3x-ui:2.8.11
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /opt/3x-ui/entrypoint.sh
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "false"
      XUI_WEB_BASE_PATH: "/nyygnwfdndcwdhq/"
      XUI_ADMIN_USERNAME: ${XUI_ADMIN_USERNAME:-}
      XUI_ADMIN_PASSWORD: ${XUI_ADMIN_PASSWORD:-}
    volumes:
      - ./mount/3x-ui/:/etc/x-ui/
      - ./config/3x-ui/entrypoint.sh:/opt/3x-ui/entrypoint.sh:ro
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  redis_queue_data:
  ebay_helper_keys:
  portainer_data:
  loki_data:
  grafana_data:
