version: "3"

services:
  ebay_postgres:
    container_name: ebay_postgres
    image: postgres:16.1
    ports:
      - "15432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebay
      POSTGRES_PASSWORD: catnip0-spoil4-untrimmed
      POSTGRES_INITDB_ARGS: --locale='en_US.UTF8'
      CFG_TIMEZONE: 'Europe/Moscow'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ebay_internal_network

  ebay_server:
    container_name: ebay_server
    image: ghcr.io/artyompetrov/ebay:latest
    depends_on:
      - ebay_postgres
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_IdentityServer__Key__Type=File
      - ASPNETCORE_IdentityServer__Key__FilePath=/certs/pfx.pfx
      - ASPNETCORE_IdentityServer__Key__Password=qwerty123
      - ASPNETCORE_ConnectionStrings__DefaultConnection=User ID=ebay;Password=catnip0-spoil4-untrimmed;Server=ebay_postgres;Port=5432;Database=ebay;Pooling=true;MinPoolSize=1;MaxPoolSize=30;Enlist=true;
    networks:
      - ebay_internal_network

  ebay_odoo:
    container_name: ebay_odoo
    image: odoo:17.0
    depends_on:
      - ebay_postgres
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config/odoo/config:/etc/odoo
      - ./config/odoo/addons:/mnt/extra-addons
    environment:
      - HOST=ebay_postgres
      - USER=ebay
      - PASSWORD=catnip0-spoil4-untrimmed
      - DATABASE=odoo
    networks:
      - ebay_internal_network
    restart: unless-stopped

  ebay_apache:
    container_name: ebay_apache
    image: httpd:2.4
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./config/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ${SSL_CERTIFICATE_FILE}:/certs/SSL_CERTIFICATE_FILE.pem
      - ${SSL_CERTIFICATE_KEY_FILE}:/certs/SSL_CERTIFICATE_KEY_FILE.pem
      - ./logs/apache:/usr/local/apache2/logs
    environment:
      - DOMAIN=${DOMAIN}
    networks:
      - ebay_internal_network
    restart: unless-stopped

networks:
  ebay_internal_network:
    driver: bridge

volumes:
  pgdata:
  odoo-web-data:
