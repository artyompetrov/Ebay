version: "3"

services:
  ebay_postgres:
    container_name: ebay_postgres
    image: postgres:16.1
    ports:
      - "15432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebay
      POSTGRES_PASSWORD: catnip0-spoil4-untrimmed
      POSTGRES_INITDB_ARGS: --locale='en_US.UTF8'
      CFG_TIMEZONE: 'Europe/Moscow'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ebay_internal_network

  ebay_server:
    container_name: ebay_server
    image: ghcr.io/artyompetrov/ebay:latest
    depends_on:
      - ebay_postgres
    ports:
      - "17443:5000"
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=https://+:5000
      - ASPNETCORE_Kestrel__Certificates__Default__Password=qwerty123
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/privkeywithpassword.pfx
      - ASPNETCORE_IdentityServer__Key__Type=File
      - ASPNETCORE_IdentityServer__Key__FilePath=/certs/pfx.pfx
      - ASPNETCORE_IdentityServer__Key__Password=qwerty123
      - ASPNETCORE_ConnectionStrings__DefaultConnection=User ID=ebay;Password=catnip0-spoil4-untrimmed;Server=ebay_postgres;Port=5432;Database=ebay;Pooling=true;MinPoolSize=1;MaxPoolSize=30;Enlist=true;
    volumes:
      - /etc/letsencrypt/live/naks42.ru/:/https/:ro
      - ./certs/:/certs/:ro
    networks:
      - ebay_internal_network

  ebay_odoo:
    container_name: ebay_odoo
    build: odoo/.
    depends_on:
      - ebay_postgres
    ports:
      - "18443:443"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./odoo/config:/etc/odoo
      - ./odoo/addons:/mnt/extra-addons
      - /etc/letsencrypt/:/etc/letsencrypt
    environment:
      - HOST=ebay_postgres
      - USER=ebay
      - PASSWORD=catnip0-spoil4-untrimmed
    networks:
      - ebay_internal_network

networks:
  ebay_internal_network:
    driver: bridge

volumes:
  pgdata:
  odoo-web-data:
