auth_enabled: false

server:
  http_listen_port: 3100

limits_config:
  allow_structured_metadata: true

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /var/lib/loki/chunks
  boltdb_shipper:
    active_index_directory: /var/lib/loki/index
    shared_store: filesystem
