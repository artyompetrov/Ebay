auth_enabled: false

server:
  http_listen_port: 3100
  otlp_http_listen_port: 4318
  otlp_grpc_listen_port: 4317

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 1h
  chunk_retain_period: 30s

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /tmp/loki
  boltdb_shipper:
    active_index_directory: /tmp/loki/index
    shared_store: filesystem
    cache_location: /tmp/loki/boltdb-cache

ruler:
  storage:
    type: local
    local:
      directory: /tmp/loki/rules
