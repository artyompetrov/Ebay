receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  transform:
  # Clients post their telemetry to the backend relay every few seconds; the relay's request logs would bury the
  # backend's own records, and the client data they carry is in Loki already.
  filter/telemetry_relay:
    error_mode: ignore
    logs:
      log_record:
        - 'IsMatch(attributes["RequestPath"], "^/api/telemetry/")'
  transform/level:
    log_statements:
      - context: log
        statements:
          - set(attributes["level"], "TRACE") where severity_number == 1
          - set(attributes["level"], "DEBUG") where severity_number == 5
          - set(attributes["level"], "INFO")  where severity_number == 9
          - set(attributes["level"], "WARN")  where severity_number == 13
          - set(attributes["level"], "ERROR") where severity_number == 17
          - set(attributes["level"], "FATAL") where severity_number == 21

  groupbyattrs/level:
    keys: ["level"]

  transform/promote_level:
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["level"], attributes["level"]) where attributes["level"] != nil
          - delete_key(attributes, "level")
  batch: {}

exporters:
  otlphttp/loki:
    endpoint: http://ebay_loki:3100/otlp
  otlp/tempo:
    endpoint: ebay_tempo:4317
    tls:
      insecure: true
  # Prometheus' native OTLP receiver; the exporter appends /v1/metrics to this endpoint.
  otlphttp/prometheus:
    endpoint: http://ebay_prometheus:9090/api/v1/otlp

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [filter/telemetry_relay, transform/level, groupbyattrs/level, transform/promote_level, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/prometheus]
