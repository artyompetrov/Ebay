receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  transform:
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["level"], "TRACE")
            where severity_number != nil and severity_number <= 4
          - set(resource.attributes["level"], "DEBUG")
            where severity_number >= 5 and severity_number <= 8
          - set(resource.attributes["level"], "INFO")
            where severity_number >= 9 and severity_number <= 12
          - set(resource.attributes["level"], "WARN")
            where severity_number >= 13 and severity_number <= 16
          - set(resource.attributes["level"], "ERROR")
            where severity_number >= 17 and severity_number <= 20
          - set(resource.attributes["level"], "FATAL")
            where severity_number >= 21
  batch: {}

exporters:
  otlphttp/loki:
    endpoint: http://ebay_loki:3100/otlp
  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform, batch]
      exporters: [debug, otlphttp/loki]