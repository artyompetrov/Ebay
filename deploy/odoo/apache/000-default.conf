<VirtualHost *:80>
    ServerName naks42.ru
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =naks42.ru
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName naks42.ru

    ProxyPreserveHost On

    # Redirect longpolling requests to Odoo longpolling port
    ProxyPass /longpolling http://127.0.0.1:8072/ retry=0
    ProxyPassReverse /longpolling http://127.0.0.1:8072/

    # Redirect other requests to Odoo main port
    ProxyPass / http://127.0.0.1:8069/
    ProxyPassReverse / http://127.0.0.1:8069/

    # SSL configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/naks42.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/naks42.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Log settings
    ErrorLog ${APACHE_LOG_DIR}/odoo-error.log
    CustomLog ${APACHE_LOG_DIR}/odoo-access.log combined

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer-when-downgrade"
        Header always set Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'"
    </IfModule>
</VirtualHost>