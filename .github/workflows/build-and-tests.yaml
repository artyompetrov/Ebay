---
name: BuildAndTest

on:
  push:
    branches:
      - '**'      # Запускается на все ветки

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  EBAY_HELPER_IMAGE_NAME: ${{ github.actor }}/ebay:latest
  EBAY_NGINX_IMAGE_NAME: ${{ github.actor }}/nginx:latest
  # Tagged with the hash of the extension inputs, so the owner, not whoever pushed, keeps lookups stable.
  EBAY_CHROME_EXTENSION_IMAGE_NAME: ${{ github.repository_owner }}/ebay-chrome-extension

jobs:

  dotnet_and_extension_build:
    name: Build .NET, run tests and build extension
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore and generate contracts
        run: |
          cd ./src/Ebay
          dotnet restore

      - name: Build .NET
        run: |
          cd ./src/Ebay
          dotnet build --configuration Release

      - name: Install Chromium for behavioral UI tests
        run: pwsh ./src/Ebay/Tests.Frontend/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run integration tests
        env:
          EbayServer__TargetEmail: integration-tests@localhost
          EbayServer__IsLocalRun: true
        run: |
          cd ./src/Ebay
          dotnet test --configuration Release

      - name: Run frontend JavaScript tests
        run: node --test ./src/Ebay/Frontend/Tests/*.test.mjs

      # Chrome extension tests run TypeScript directly via Node's built-in type stripping (Node 22.18+).
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run Chrome extension tests
        run: |
          cd ./src/ChromeExtension
          npm ci
          npm test


  openspec_validate:
    name: Validate OpenSpec
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install OpenSpec CLI
        run: npm install -g "@fission-ai/openspec@$(cat .openspec-version)"

      - name: Check OpenSpec CLI and skills versions
        run: make openspec-version-check

      - name: Validate OpenSpec catalog
        run: openspec validate --all --strict --json

      - name: Validate OpenSpec archive
        run: openspec validate --archived

      - name: Check OpenSpec scenario test coverage
        run: make openspec-coverage-check

  build_docker:
    name: Build Docker Images
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # NSwag writes the extension's API client while building Server.Client; it is part of the extension inputs hash.
      - name: Generate Chrome extension API client
        run: dotnet build ./src/Ebay/Server.Client --configuration Release

      # Every branch logs in: the extension image is private and is looked up and pulled on every build. Only main pushes.
      # Runs without the PAT secret (e.g. Dependabot's) skip the registry and build the extension locally.
      - name: Log in to the registry
        id: registry
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "PAT secret is not available, the Chrome extension image will be built without a registry lookup"
            echo "logged_in=false" >> "$GITHUB_OUTPUT"
          else
            echo "$PAT" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            echo "logged_in=true" >> "$GITHUB_OUTPUT"
          fi

      # The extension is rebuilt, and so gets a new version, only when no image exists for the hash of its inputs,
      # or when that image is older than `latest` (the inputs were reverted): Chrome never downgrades, so reusing it
      # would leave users on the reverted code. Only a "manifest unknown" answer means there is no image: any other
      # lookup error fails the build instead of republishing the extension under a new version.
      - name: Reuse or build Chrome extension image
        id: chrome_extension
        run: |
          INPUTS_HASH=$(cd ./src/ChromeExtension && npm run --silent inputs-hash)
          EXTENSION_IMAGE="${{ env.REGISTRY }}/${{ env.EBAY_CHROME_EXTENSION_IMAGE_NAME }}:$INPUTS_HASH"
          LATEST_IMAGE="${{ env.REGISTRY }}/${{ env.EBAY_CHROME_EXTENSION_IMAGE_NAME }}:latest"
          echo "image=$EXTENSION_IMAGE" >> "$GITHUB_OUTPUT"
          image_exists() {
            local lookup
            if lookup=$(docker manifest inspect "$1" 2>&1); then
              return 0
            elif grep -qi "manifest unknown" <<< "$lookup"; then
              return 1
            fi
            echo "Cannot look up $1: $lookup" >&2
            exit 1
          }
          image_version() {
            docker image inspect --format '{{ index .Config.Labels "version" }}' "$1"
          }
          BUILT=true
          if [ "${{ steps.registry.outputs.logged_in }}" = "true" ] && image_exists "$EXTENSION_IMAGE"; then
            docker pull -q "$EXTENSION_IMAGE"
            BUILT=false
            if image_exists "$LATEST_IMAGE"; then
              docker pull -q "$LATEST_IMAGE"
              REUSED_VERSION=$(image_version "$EXTENSION_IMAGE")
              LATEST_VERSION=$(image_version "$LATEST_IMAGE")
              if [ "$REUSED_VERSION" != "$LATEST_VERSION" ] && [ "$(printf '%s\n' "$REUSED_VERSION" "$LATEST_VERSION" | sort -V | tail -n 1)" = "$LATEST_VERSION" ]; then
                echo "$EXTENSION_IMAGE has version $REUSED_VERSION, older than latest $LATEST_VERSION (inputs were reverted), rebuilding"
                BUILT=true
              fi
            fi
          fi
          if [ "$BUILT" = "false" ]; then
            echo "Chrome extension inputs unchanged, reusing $EXTENSION_IMAGE"
          else
            EXTENSION_VERSION=$(date +'%y%m.%d.%H.%M%S')
            echo "Building $EXTENSION_IMAGE"
            docker build --build-arg BUILD_VERSION="$EXTENSION_VERSION" --build-arg EBAY_HELPER_BACKEND_DOMAIN="${{ secrets.EBAY_HELPER_BACKEND_DOMAIN }}" --tag "$EXTENSION_IMAGE" ./src/ChromeExtension/
          fi
          echo "Chrome extension version: $(image_version "$EXTENSION_IMAGE")"
          echo "built=$BUILT" >> "$GITHUB_OUTPUT"

      - name: Build Docker Images
        run: |
          BUILD_VERSION=$(date +'%y%m.%d.%H.%M%S')
          docker build -f ./src/Dockerfile --build-arg BUILD_VERSION="$BUILD_VERSION" --build-arg EXTENSION_IMAGE="${{ steps.chrome_extension.outputs.image }}" --tag ${{ env.REGISTRY }}/${{ env.EBAY_HELPER_IMAGE_NAME }} ./src/
          docker build -f ./deploy/build/nginx/Dockerfile --tag ${{ env.REGISTRY }}/${{ env.EBAY_NGINX_IMAGE_NAME }} ./deploy/build/nginx/

      # `latest` always matches the extension deployed from main: the next build compares against it, and local builds of src/Dockerfile default to it.
      - name: Publish Docker Images
        if: github.ref == 'refs/heads/main'
        run: |
          EXTENSION_IMAGE="${{ steps.chrome_extension.outputs.image }}"
          if [ "${{ steps.chrome_extension.outputs.built }}" = "true" ]; then
            docker push "$EXTENSION_IMAGE"
          fi
          docker tag "$EXTENSION_IMAGE" ${{ env.REGISTRY }}/${{ env.EBAY_CHROME_EXTENSION_IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.EBAY_CHROME_EXTENSION_IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.EBAY_HELPER_IMAGE_NAME }}
          docker push ${{ env.REGISTRY }}/${{ env.EBAY_NGINX_IMAGE_NAME }}

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    needs: [ dotnet_and_extension_build, openspec_validate, build_docker ]
    if: github.ref == 'refs/heads/main'  # Запускается только на ветке main

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SSH Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # The script comes from this checkout, so the server needs no deploy script of its own.
      # `bash -c "$(cat)"` reads the whole script before running it, so no command inside can consume it from stdin.
      - name: Update and redeploy on the server
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR }}/Ebay && bash -c \"\$(cat)\"" < scripts/deploy-on-server/deploy-on-server.sh

      - name: Cleanup SSH
        run: rm -rf ~/.ssh
