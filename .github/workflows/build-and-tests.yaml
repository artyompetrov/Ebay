---
name: BuildAndTest

on:
  push:
    branches:
      - '**'      # Запускается на все ветки

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  EBAY_HELPER_IMAGE_NAME: ${{ github.actor }}/ebay:latest
  EBAY_NGINX_IMAGE_NAME: ${{ github.actor }}/nginx:latest

jobs:

  dotnet_and_extension_build:
    name: Build .NET, run tests and build extension
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ebay
          POSTGRES_PASSWORD: catnip0-spoil4-untrimmed
          POSTGRES_DB: ebay
        ports:
          - 15432:5432
        options: >-
          --health-cmd="pg_isready -U ebay -d ebay"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore and generate contracts
        run: |
          cd ./src/Ebay
          dotnet restore

      - name: Build .NET
        run: |
          cd ./src/Ebay
          dotnet build --configuration Release

      - name: Initialize integration test database
        env:
          PGPASSWORD: catnip0-spoil4-untrimmed
        run: |
          psql -h localhost -p 15432 -U ebay -d ebay -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS hstore;
          SQL

      - name: Run integration tests
        env:
          ConnectionStrings__DefaultConnection: User ID=ebay;Password=catnip0-spoil4-untrimmed;Server=localhost;Port=15432;Database=ebay;Pooling=true;MinPoolSize=1;MaxPoolSize=60;Enlist=true;Include Error Detail=true;
          EbayServer__TargetEmail: integration-tests@localhost
          EbayServer__IsLocalRun: true
        run: |
          cd ./src/Ebay
          dotnet test --configuration Release


  build_docker:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker Images
        run: |
          BUILD_VERSION=$(date +'%y%m.%d.%H.%M%S' | sed 's/\.0*/./g')
          docker build -f ./src/Dockerfile --build-arg BUILD_VERSION="$BUILD_VERSION" --build-arg EBAY_HELPER_BACKEND_DOMAIN="${{ secrets.EBAY_HELPER_BACKEND_DOMAIN }}" --tag ${{ env.REGISTRY }}/${{ env.EBAY_HELPER_IMAGE_NAME }} ./src/
          docker build -f ./deploy/build/nginx/Dockerfile --tag ${{ env.REGISTRY }}/${{ env.EBAY_NGINX_IMAGE_NAME }} ./deploy/build/nginx/

      - name: Publish Docker Images
        if: github.ref == 'refs/heads/main'
        run: |
          echo ${{ secrets.PAT }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker push ${{ env.REGISTRY }}/${{ env.EBAY_HELPER_IMAGE_NAME }}
          docker push ${{ env.REGISTRY }}/${{ env.EBAY_NGINX_IMAGE_NAME }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ dotnet_and_extension_build, build_docker ]
    if: github.ref == 'refs/heads/main'  # Запускается только на ветке main

    steps: 
      - name: Install SSH Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Connect and Pull Latest Image
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR }} && ./update.sh"

      - name: Cleanup SSH
        run: rm -rf ~/.ssh

