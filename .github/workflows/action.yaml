name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'      # Запускается на все ветки

concurrency:
  group: develop-ebay-${{ github.event.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  DOTNET_IMAGE_NAME: ${{ github.actor }}/ebay:latest
  FRAPPE_IMAGE_NAME: ${{ github.actor }}/frappe:latest

jobs:
  test_dotnet:
    name: Run .NET Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      
      - name: Restore .NET Dependencies
        working-directory: ./src/Ebay
        run: dotnet restore 

      - name: Build .NET
        working-directory: ./src/Ebay
        run: dotnet build --no-restore --configuration Release

      - name: Run .NET Tests
        working-directory: ./src/Ebay
        run: dotnet test --no-build --verbosity normal --configuration Release

      - name: Install Node.js Dependencies
        working-directory: ./src/ChromeExtension
        run: npm install

      - name: Build Node.js Modules
        working-directory: ./src/ChromeExtension
        run: npm run build

  publish_dotnet:
    name: Publish .NET Docker Image
    runs-on: ubuntu-latest
    needs: test_dotnet
    if: github.ref == 'refs/heads/main'  # Запускается только на ветке main

    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: echo ${{ secrets.PAT }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Image
        run: |
          BUILD_VERSION=$(date +'%y%m.%d.%H.%M%S' | sed 's/\.0*/./g')
          docker build -f ./src/dotnet.Dockerfile --build-arg BUILD_VERSION="$BUILD_VERSION" --tag ${{ env.REGISTRY }}/${{ env.DOTNET_IMAGE_NAME }} ./src/
          docker push ${{ env.REGISTRY }}/${{ env.DOTNET_IMAGE_NAME }}

  test_frappe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Run Frappe Tests

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        working-directory: ./src/frappe_ebay
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app ebay $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app ebay
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app ebay
        env:
          TYPE: server

  publish_frappe:
    name: Publish Frappe Docker Image
    runs-on: ubuntu-latest
    needs: test_frappe
    if: github.ref == 'refs/heads/main'  # Запускается только на ветке main

    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: echo ${{ secrets.PAT }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Image
        run: |
          BUILD_VERSION=$(date +'%y%m.%d.%H.%M%S' | sed 's/\.0*/./g')
          docker build -f ./src/frappe.Dockerfile --build-arg BUILD_VERSION="$BUILD_VERSION" --tag ${{ env.REGISTRY }}/${{ env.FRAPPE_IMAGE_NAME }} ./src/
          docker push ${{ env.REGISTRY }}/${{ env.FRAPPE_IMAGE_NAME }}

  deploy:
    name: Deploy Docker Image
    runs-on: ubuntu-latest
    needs: [ publish_dotnet, publish_frappe ]
    if: github.ref == 'refs/heads/main'  # Запускается только на ветке main

    steps:
      - name: Install SSH Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Connect and Pull Latest Image
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR }} && ./update.sh"

      - name: Cleanup SSH
        run: rm -rf ~/.ssh