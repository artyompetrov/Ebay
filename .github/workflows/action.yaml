name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'      # Запускается на все ветки

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  DOTNET_IMAGE_NAME: ${{ github.actor }}/ebay:latest

jobs:
  test_dotnet:
    name: Run .NET Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      
      - name: Restore .NET Dependencies
        working-directory: ./src/Ebay
        run: dotnet restore 

      - name: Build .NET
        working-directory: ./src/Ebay
        run: dotnet build --no-restore --configuration Release

# ходит на продакшн в момент билда
#      - name: Run .NET Tests
#        working-directory: ./src/Ebay
#        run: dotnet test --no-build --filter "TestCategory!=ExplicitOnly" --verbosity normal --configuration Release

      - name: Install Node.js Dependencies
        working-directory: ./src/ChromeExtension
        run: npm install

      - name: Build Node.js Modules
        working-directory: ./src/ChromeExtension
        run: npm run build

  publish_dotnet:
    name: Publish .NET Docker Image
    runs-on: ubuntu-latest
    needs: test_dotnet
    if: github.ref == 'refs/heads/main'  # Запускается только на ветке main

    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: echo ${{ secrets.PAT }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Image
        run: |
          BUILD_VERSION=$(date +'%y%m.%d.%H.%M%S' | sed 's/\.0*/./g')
          docker build -f ./src/dotnet.Dockerfile --build-arg BUILD_VERSION="$BUILD_VERSION" --tag ${{ env.REGISTRY }}/${{ env.DOTNET_IMAGE_NAME }} ./src/
          docker push ${{ env.REGISTRY }}/${{ env.DOTNET_IMAGE_NAME }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ publish_dotnet ]
    if: github.ref == 'refs/heads/main'  # Запускается только на ветке main

    steps:
      - name: Install SSH Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Connect and Pull Latest Image
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR }} && ./update.sh"

      - name: Cleanup SSH
        run: rm -rf ~/.ssh